name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1", "6.2"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test --skip-build

  # The tests use swift-testing, which ships with Swift 6. Older toolchains
  # build the library only. SwiftPM picks the newest Vapor and Leaf they support.
  build-older:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.9", "5.10"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target PrivatusAnalyticsVapor

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  lint:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift format lint --strict --recursive Package.swift Sources Tests

  build:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
