name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.9", "5.10", "6.0", "6.1"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test --skip-build

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  lint:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift format lint --strict --recursive Package.swift Sources Tests

  build:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
