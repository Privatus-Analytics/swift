name: Release

# Swift packages are not uploaded anywhere. A version is a git tag, and the
# Swift Package Index picks up new tags by itself. This workflow checks the tag
# and makes a GitHub release for it. It needs no secrets.
on:
  push:
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    runs-on: ubuntu-24.04
    container: swift:6.0
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test --skip-build
      - run: swift build -c release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
